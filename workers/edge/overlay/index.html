<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sylva overlay</title>
<style>
  /* Sylva's overlay for OBS. One page, several widgets: the alert box (the
     default); with ?widget= an event list, a latest or top label, a goal bar
     or a chat box; and with ?scene every widget at once, placed the way the
     streamer published it in the editor. Flat surfaces, 1px borders, one
     color per kind of event. */
  @font-face {
    font-family: "Inter";
    src: url("/fonts/inter-latin-wght.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --surface: #161618; --border: #3d3d44; --text: #ededef; --muted: #a4a4ac;
    --follow: #3ecf74; --subscriber: #9b7bf7; --giftedSub: #ec5c9e; --communityGift: #ec5c9e;
    --cheer: #5b8def; --tip: #eab308; --redemption: #f08a3c; --raid: #2bbfae; --other: #8b8b94;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  html, body { margin: 0; background: transparent; font: 16px/1.5 Inter, system-ui, sans-serif; color: var(--text); overflow: hidden; }
  * { box-sizing: border-box; }
  #status { position: fixed; left: 8px; bottom: 8px; font-size: 11px; color: var(--muted); display: none; }
  body.debug #status { display: block; }
  @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  @keyframes leave { to { opacity: 0; transform: translateY(-8px); } }
  @keyframes slide { from { opacity: 0; transform: translateX(-12px); } }
  .k { --c: var(--other); }

  /* Alert box */
  #stage, .stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .card {
    min-width: 320px; max-width: 560px; padding: 20px 24px; border-radius: 12px;
    background: color-mix(in srgb, var(--c) 14%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--c) 45%, var(--border));
    animation: arrive 450ms var(--ease) both;
  }
  .card.leave { animation: leave 300ms var(--ease) both; }
  .card .art { display: block; max-width: 100%; max-height: 160px; margin: 0 auto 10px; object-fit: contain; }
  .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--c); font-weight: 600; }
  .name { font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
  .detail { color: var(--muted); font-variant-numeric: tabular-nums; }
  .message { margin-top: 6px; }

  /* Event list */
  .list { position: absolute; inset: 12px; display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px;
    background: color-mix(in srgb, var(--c) 14%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--c) 40%, var(--border));
    animation: slide 450ms var(--ease) both;
  }
  .row .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  .row b { font-weight: 650; }
  .row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Latest label */
  .latest { position: absolute; inset: 6px; display: flex; align-items: center; padding: 0 16px; gap: 12px; white-space: nowrap; border-radius: 10px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--border)); }
  .latest .label { font-size: 13px; }
  .latest .who { font-size: 22px; font-weight: 650; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; }
  .latest .who.fresh { animation: arrive 450ms var(--ease) both; }
  .latest .amount { color: var(--muted); font-size: 18px; font-variant-numeric: tabular-nums; }

  /* Goal bar */
  .goal { position: absolute; inset: 6px; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--border)); }
  .goal:empty { display: none; }
  .goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .goal-title { font-size: 18px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goal-num { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .goal-num b { color: var(--text); }
  .track { height: 14px; border-radius: 7px; background: color-mix(in srgb, var(--c) 18%, #0e0e10); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--c); border-radius: 7px; transition: width 800ms var(--ease); }

  /* Chat box */
  .chat { position: absolute; inset: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; overflow: hidden; }
  .line { padding: 6px 12px; border-radius: 8px; background: rgba(22, 22, 24, .82); border: 1px solid #2a2a2f; animation: slide 300ms var(--ease) both; overflow-wrap: anywhere; }
  .line b { font-weight: 650; margin-right: 6px; color: #c9b8ff; }
  .line .badge { height: 1.1em; vertical-align: -0.15em; margin-right: 4px; }
  .line .emote { height: 1.6em; vertical-align: middle; margin: -0.3em 0; }

  /* Scene: a 1920 by 1080 canvas scaled to the source, items placed on it. */
  .fill-page { position: fixed; inset: 0; }
  #scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .item { position: absolute; }
  iframe.custom { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: normal; }
  body.debug .item { outline: 1px dashed rgba(255, 255, 255, .35); }
  body.debug .item::before { content: attr(data-label); position: absolute; left: 6px; top: -20px; font-size: 12px; color: rgba(255, 255, 255, .6); }
</style>
</head>
<body>
<div id="root"></div>
<div id="status">connecting</div>
<script>
(() => {
  const key = decodeURIComponent(location.pathname.split('/').pop());
  const params = new URLSearchParams(location.search);
  // Badge images and 7TV, BetterTTV and FrankerFaceZ emotes for chat.
  let assets = null;
  const assetsReady = fetch(`/v1/chat-assets/${key}`)
    .then((r) => (r.ok ? r.json() : null)).catch(() => null)
    .then((a) => { assets = a; return a; });
  const sceneMode = params.has('scene');
  const widget = sceneMode ? 'scene' : (params.get('widget') || 'alerts');
  if (params.has('debug')) document.body.classList.add('debug');
  const root = document.getElementById('root');
  const status = document.getElementById('status');
  const KINDS = ['follow', 'subscriber', 'giftedSub', 'communityGift', 'cheer', 'tip', 'redemption', 'raid'];
  const kindClass = (k) => KINDS.includes(k) ? k : 'other';
  const fmt = new Intl.NumberFormat();
  const n = (x) => fmt.format(x || 0);
  const clamp = (v, lo, hi, d) => Math.min(Math.max(Number(v) || d, lo), hi);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  };
  const nameOf = (e) => (e.actor ? e.actor.displayName : 'Anonymous');

  // Exposed for automated tests.
  window.sylva = { widget, shown: [], acked: [], data: null, scene: null };

  // The built-in widgets (pill alerts and Twitch-style chat), put in by the
  // server. The alert box and chat box show them, and so does a channel that
  // has not published a layout yet.
  const DEFAULTS = /*SYLVA_DEFAULTS*/null;
  const DEFAULT_ITEMS = [
    { id: 'default-alerts', widget: 'alerts', x: 0, y: 0, w: 1920, h: 1080 },
    { id: 'default-chat', widget: 'chat', x: 1476, y: 120, w: 420, h: 840 },
  ];
  const builtIn = (it) => (DEFAULTS && DEFAULTS[it.widget] ? Object.assign({}, it, { widget: 'custom', code: DEFAULTS[it.widget] }) : it);

  /* ---------------- Alert box ---------------- */
  // The channel's alert settings set how long each alert stays. A `duration`
  // in the link (milliseconds) overrides them for this overlay only.
  const linkMs = Number(params.get('duration')) || 0;
  const LABELS = {
    follow: 'New follower', subscriber: 'New subscriber', giftedSub: 'Gifted sub',
    communityGift: 'Gifted subs', cheer: 'Cheer', tip: 'Tip', redemption: 'Redemption', raid: 'Raid',
  };
  const oldDetail = (e) => {
    switch (e.kind) {
      case 'cheer': return `${e.amount} bits`;
      case 'raid': return `with ${e.amount} viewers`;
      case 'communityGift': return `gave ${e.amount} subs`;
      case 'subscriber': return e.amount ? `${e.amount} months` : '';
      case 'redemption': return e.redemption || '';
      default: return '';
    }
  };
  // Older servers send no view: build one the way they used to look.
  const fallbackView = (e) => ({
    label: LABELS[e.kind] || e.rawType, name: nameOf(e), detail: oldDetail(e), message: e.message, durationMs: 5000,
  });
  // One alert box per page. In a scene it moves into the alert box's place
  // whenever the layout changes, so an alert on screen is not cut short.
  // Uploaded alert sounds and images, by id.
  const mediaUrl = (id) => `${location.origin}/media/${key}/${encodeURIComponent(id)}`;
  let soundOff = false;
  let playing = null;
  // One audio element per sound, loaded ahead and kept, so a sound starts the
  // instant its alert shows instead of after a download.
  const sounds = new Map();
  const audioFor = (id) => {
    let a = sounds.get(id);
    if (!a) {
      a = new Audio(mediaUrl(id));
      a.preload = 'auto';
      sounds.set(id, a);
      if (sounds.size > 24) sounds.delete(sounds.keys().next().value);
    }
    return a;
  };
  const preloadSound = (view) => { if (view && view.sound && !soundOff) audioFor(view.sound); };
  // A tip's message read aloud, after the alert's own sound.
  let speaking = null, speakTimer = null;
  const speak = (view) => {
    if (!view || !view.tts || soundOff) return;
    const t = new Audio(`${location.origin}/tts/${key}/${encodeURIComponent(view.tts)}`);
    const vol = view.ttsVolume === undefined ? view.volume : view.ttsVolume;
    t.volume = Math.min(1, Math.max(0, (vol === undefined ? 70 : vol) / 100));
    speaking = t;
    const p = t.play();
    if (p && p.catch) p.catch(() => {});
  };
  const playSound = (view) => {
    stopSound();
    if (!view || soundOff) return;
    // The streamer's chosen wait between the alert sound and the message.
    const wait = Math.min(10000, Math.max(0, Number(view.ttsDelayMs) || 0));
    if (!view.sound) { speakTimer = setTimeout(() => speak(view), 400 + wait); return; }
    const a = audioFor(view.sound);
    a.volume = Math.min(1, Math.max(0, (view.volume === undefined ? 70 : view.volume) / 100));
    try { a.currentTime = 0; } catch (x) { /* not loaded yet */ }
    if (view.tts) {
      let done = false;
      const next = () => {
        if (done || playing !== a) return;
        done = true;
        clearTimeout(speakTimer);
        speakTimer = setTimeout(() => { if (playing === a) speak(view); }, wait);
      };
      a.onended = next;
      // A long sound should not hold the message back for ever.
      speakTimer = setTimeout(next, 6000);
    } else a.onended = null;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
    playing = a;
  };
  const stopSound = () => {
    clearTimeout(speakTimer);
    if (playing) { playing.onended = null; playing.pause(); playing = null; }
    if (speaking) { speaking.pause(); speaking = null; }
  };

  function alertBox(ack) {
    const stage = el('div', 'stage');
    let current = null, timer = null;
    const hide = () => {
      const card = stage.querySelector('.card');
      if (card) { card.classList.add('leave'); setTimeout(() => card.remove(), 300); }
    };
    return {
      node: stage,
      play(frame) {
        if (frame.alertId === current) return;
        clearTimeout(timer);
        current = frame.alertId;
        window.sylva.shown.push(frame.alertId);
        const view = frame.view || fallbackView(frame.event);
        stage.textContent = '';
        const card = el('div', 'card k');
        card.dataset.alertId = frame.alertId;
        card.style.setProperty('--c', `var(--${kindClass(frame.event.kind)})`);
        if (view.image) {
          const art = el('img', 'art');
          art.src = mediaUrl(view.image);
          art.alt = '';
          card.appendChild(art);
        }
        playSound(view);
        for (const [cls, text] of [['label', view.label], ['name', view.name], ['detail', view.detail], ['message', view.message]]) {
          if (text) card.appendChild(el('div', cls, text));
        }
        stage.appendChild(card);
        timer = setTimeout(() => {
          hide();
          if (current === frame.alertId) ack(frame.alertId);
          current = null;
        }, linkMs || view.durationMs || 5000);
      },
      stop(id) { if (id === current) { clearTimeout(timer); hide(); stopSound(); current = null; } },
    };
  }

  /* ---------------- Widgets ---------------- */
  // Each takes the element to draw in and its options, and answers to
  // data (the full picture on connect), event (live) and top (top labels).
  const sentence = (e) => {
    const who = nameOf(e);
    switch (e.kind) {
      case 'follow': return [who, 'followed'];
      case 'subscriber': return [who, e.amount > 1 ? `resubscribed, ${n(e.amount)} months` : 'subscribed'];
      case 'giftedSub': return [who, 'got a gifted sub'];
      case 'communityGift': return [who, e.amount === 1 ? 'gifted a sub' : `gifted ${n(e.amount)} subs`];
      case 'cheer': return [who, `cheered ${n(e.amount)} bits`];
      case 'raid': return [who, `raided with ${n(e.amount)} viewers`];
      case 'tip': return [who, 'tipped'];
      case 'redemption': return [who, `redeemed ${e.redemption || 'a reward'}`];
      default: return [who, ''];
    }
  };
  const LIST = ['follow', 'subscriber', 'communityGift', 'cheer', 'raid', 'tip', 'redemption'];

  function eventList(host, opts) {
    const limit = clamp(opts.limit, 1, 20, 5);
    const box = el('div', 'list');
    host.appendChild(box);
    const row = (e, fresh) => {
      const r = el('div', 'row k');
      r.style.setProperty('--c', `var(--${kindClass(e.kind)})`);
      r.appendChild(el('span', 'dot'));
      const [who, what] = sentence(e);
      const t = el('span');
      t.appendChild(el('b', null, who));
      t.appendChild(document.createTextNode(' ' + what));
      r.appendChild(t);
      // Test events leave after 30 seconds, like everywhere else.
      if (e.platform === 'sylva') {
        const ms = fresh ? 30000 : Math.min(30000, Math.max(0, e.receivedAt + 30000 - Date.now()));
        setTimeout(() => r.remove(), ms);
      }
      return r;
    };
    return {
      data(d) {
        box.textContent = '';
        d.recent.slice(0, limit).forEach((e) => box.appendChild(row(e, false)));
      },
      event(e) {
        if (!LIST.includes(e.kind)) return;
        box.prepend(row(e, true));
        while (box.children.length > limit) box.lastChild.remove();
      },
    };
  }

  // A one line label: the kind, a name and maybe an amount.
  function labelBox(host, kind, title) {
    const box = el('div', 'latest k');
    box.style.setProperty('--c', `var(--${kind})`);
    host.appendChild(box);
    return (name, amount, fresh) => {
      box.textContent = '';
      box.appendChild(el('span', 'label', title));
      box.appendChild(el('span', 'who' + (fresh ? ' fresh' : ''), name || 'Nobody yet'));
      if (name && amount) box.appendChild(el('span', 'amount', n(amount)));
    };
  }

  const LATEST_LABELS = { follow: 'Latest follower', subscriber: 'Latest sub', communityGift: 'Latest gifter', cheer: 'Latest cheer', raid: 'Latest raid' };
  const WITH_AMOUNT = ['cheer', 'raid', 'communityGift'];
  function latestLabel(host, opts) {
    const kind = LATEST_LABELS[opts.kind] ? opts.kind : 'follow';
    const show = labelBox(host, kind, LATEST_LABELS[kind]);
    const put = (e, fresh) => show(e ? nameOf(e) : null, e && WITH_AMOUNT.includes(kind) ? e.amount : 0, fresh);
    put(null);
    return {
      data(d) { put(d.latest.find((e) => e.kind === kind) || null); },
      event(e) { if (e.kind === kind) put(e, true); },
    };
  }

  const TOP_LABELS = { cheer: 'Top cheer', communityGift: 'Top gifter' };
  function topLabel(host, opts) {
    const kind = TOP_LABELS[opts.kind] ? opts.kind : 'cheer';
    const show = labelBox(host, kind, TOP_LABELS[kind]);
    let shown = null;
    const put = (list) => {
      const t = (list || []).find((x) => x.kind === kind) || null;
      const id = t ? `${t.name}:${t.amount}` : '';
      if (id === shown) return;
      show(t && t.name, t && t.amount, shown !== null && !!t);
      shown = id;
    };
    put([]);
    return { data(d) { put(d.top); }, top(list) { put(list); } };
  }

  const GOAL_COLORS = { follows: 'follow', subs: 'subscriber', bits: 'cheer' };
  const goalCounts = (goal, e) => {
    if (goal.kind === 'follows') return e.kind === 'follow' ? 1 : 0;
    if (goal.kind === 'subs') return e.kind === 'subscriber' || e.kind === 'giftedSub' ? 1 : 0;
    if (goal.kind === 'bits') return e.kind === 'cheer' ? Math.max(0, e.amount || 0) : 0;
    return 0;
  };
  function goalBar(host) {
    const box = el('div', 'goal k');
    host.appendChild(box);
    let goal = null;
    const draw = () => {
      box.textContent = '';
      if (!goal) return;
      box.style.setProperty('--c', `var(--${GOAL_COLORS[goal.kind] || 'other'})`);
      const top = el('div', 'goal-top');
      top.appendChild(el('span', 'goal-title', goal.title));
      const num = el('span', 'goal-num');
      num.appendChild(el('b', null, n(goal.current)));
      num.appendChild(document.createTextNode(` / ${n(goal.target)}`));
      top.appendChild(num);
      const track = el('div', 'track');
      const fill = el('div', 'fill');
      track.appendChild(fill);
      box.append(top, track);
      requestAnimationFrame(() => { fill.style.width = Math.min(100, (goal.current / goal.target) * 100) + '%'; });
    };
    return {
      data(d) { goal = d.goal ? { ...d.goal } : null; draw(); },
      event(e) {
        if (!goal || e.receivedAt < goal.since) return;
        const add = goalCounts(goal, e);
        if (add) { goal.current += add; draw(); }
      },
    };
  }

  function chatBox(host, opts) {
    const limit = clamp(opts.limit, 1, 30, 12);
    const box = el('div', 'chat');
    host.appendChild(box);
    const img = (cls, src, alt) => { const i = el('img', cls); i.src = src; i.alt = alt; return i; };
    const line = (e) => {
      const l = el('div', 'line');
      const raw = e.raw || {};
      const a = assets || { badges: {}, emotes: {} };
      for (const b of raw.badges || []) {
        const u = a.badges[b.set_id + '/' + b.id];
        if (u) l.appendChild(img('badge', u, ''));
      }
      const name = el('b', null, nameOf(e));
      if (/^#[0-9a-f]{6}$/i.test(raw.color || '')) name.style.color = raw.color;
      l.appendChild(name);
      // Twitch's own emotes come marked in the message; 7TV, BetterTTV and
      // FrankerFaceZ ones are found by name.
      const twitch = {};
      for (const f of (raw.message && raw.message.fragments) || []) {
        if (f && f.type === 'emote' && f.emote && /^[\w-]+$/.test(f.emote.id || '')) {
          twitch[f.text] = `https://static-cdn.jtvnw.net/emoticons/v2/${f.emote.id}/default/dark/2.0`;
        }
      }
      for (const w of String(e.message || '').split(/(\s+)/)) {
        const own = Object.prototype.hasOwnProperty;
        const u = own.call(twitch, w) ? twitch[w] : own.call(a.emotes, w) ? a.emotes[w].urls['2'] : null;
        l.appendChild(u ? img('emote', u, w) : document.createTextNode(w));
      }
      return l;
    };
    const trim = () => { while (box.children.length > limit) box.firstChild.remove(); };
    return {
      data(d) {
        const fill = () => { box.textContent = ''; d.chat.forEach((e) => box.appendChild(line(e))); trim(); };
        fill();
        if (!assets) assetsReady.then((x) => { if (x) fill(); });
      },
      event(e) { if (e.kind === 'chat') { box.appendChild(line(e)); trim(); } },
    };
  }

  // The streamer's own code, in a sandboxed frame (see /overlay-frame). In
  // alert mode it plays alerts from the queue and says when each is done.
  function customWidget(host, it, ack, onShown) {
    const code = it.code || {};
    const frame = el('iframe', 'custom');
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.setAttribute('scrolling', 'no');
    frame.title = code.name || 'Custom widget';
    frame.src = '/overlay-frame';
    host.appendChild(frame);
    let ready = false, current = null, timer = null;
    // The alert sent to the widget whose sound waits for it to show.
    let pending = null;
    const queue = [];
    const post = (m) => {
      const msg = Object.assign({ sylva: true }, m);
      if (ready) frame.contentWindow.postMessage(msg, '*'); else queue.push(msg);
    };
    const finish = (id) => {
      if (id !== current) return;
      clearTimeout(timer);
      current = null;
      pending = null;
      ack(id);
    };
    const onMessage = (m) => {
      if (m.source !== frame.contentWindow || !m.data || m.data.sylvaFrame !== true) return;
      if (m.data.type === 'ready' && !ready) {
        ready = true;
        frame.contentWindow.postMessage({
          sylva: true, type: 'load', html: code.html, css: code.css, js: code.js,
          fields: code.fields, values: code.values, alerts: !!code.alerts,
          data: window.sylva.data, channel: '',
        }, '*');
        queue.splice(0).forEach((q) => frame.contentWindow.postMessage(q, '*'));
        assetsReady.then((a) => { if (a) frame.contentWindow.postMessage({ sylva: true, type: 'assets', assets: a }, '*'); });
      } else if (m.data.type === 'shown') {
        if (!pending || pending.f.alertId !== m.data.id || m.data.id !== current) return;
        const p = pending;
        pending = null;
        // A paced widget says done itself once the alert has left, which can
        // be later than the alert's time: give it until the server would.
        if (m.data.paced) {
          clearTimeout(timer);
          const id = m.data.id;
          timer = setTimeout(() => finish(id), 38000);
        }
        playSound(p.view);
        if (onShown) onShown(p.f);
      } else if (m.data.type === 'done') finish(m.data.id);
    };
    addEventListener('message', onMessage);
    return {
      data(d) { post({ type: 'data', data: d }); },
      event(e) { post({ type: 'event', event: e }); },
      top(list) { post({ type: 'top', top: list }); },
      play(f) {
        // A reconnect sends the alert on screen again: it is already showing.
        if (f.alertId === current) return;
        if (current !== null) finish(current);
        current = f.alertId;
        window.sylva.shown.push(f.alertId);
        const base = f.view || fallbackView(f.event);
        // The page plays the alert's sound; the widget gets links to both.
        const view = Object.assign({}, base, {
          soundUrl: base.sound ? mediaUrl(base.sound) : '',
          imageUrl: base.image ? mediaUrl(base.image) : '',
        });
        // The sound starts when the widget says the alert is on screen.
        preloadSound(view);
        pending = { f, view };
        post({ type: 'alert', id: f.alertId, event: f.event, view });
        // A widget that never says done must not hold up the queue.
        const ms = (linkMs || view.durationMs || 5000) + 15000;
        timer = setTimeout(() => finish(f.alertId), ms);
      },
      stop(id) { if (id === current) { clearTimeout(timer); current = null; pending = null; stopSound(); post({ type: 'stop', id }); } },
      mute(muted) { post({ type: 'mute', muted }); },
      remove() { removeEventListener('message', onMessage); clearTimeout(timer); pending = null; frame.remove(); },
    };
  }

  const WIDGETS = { feed: eventList, latest: latestLabel, top: topLabel, goal: goalBar, chat: chatBox };
  const NAMES = { alerts: 'Alert box', feed: 'Event list', latest: 'Latest label', top: 'Top label', goal: 'Goal bar', chat: 'Chat box', custom: 'Custom widget' };

  /* ---------------- Connection ---------------- */
  // One socket for a role. The alert box connects as `overlay` (it plays
  // and acknowledges alerts); widgets connect as `widget`.
  // A socket can die without a close (Wi-Fi blip, sleep, a proxy dropping
  // it). Ping often and treat a quiet socket as dead, so OBS reconnects in
  // seconds instead of missing alerts. The server's runtime answers pings
  // without waking the channel, so this costs nothing.
  const PING_MS = 10000, DEAD_MS = 25000;
  function socket(role, onFrame) {
    let ws = null, backoff = 250, closed = false, retry = null, heard = 0;
    const again = () => {
      if (closed || retry) return;
      retry = setTimeout(() => { retry = null; open(); }, backoff + Math.random() * 250);
      backoff = Math.min(backoff * 2, 5000);
    };
    const open = () => {
      if (closed) return;
      heard = Date.now();
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      // The link's token lets this page connect without signing in.
      const token = params.get('token');
      const query = token ? `?token=${encodeURIComponent(token)}` : '';
      const sock = new WebSocket(`${proto}://${location.host}/v1/channels/${key}/ws${query}`);
      ws = sock;
      sock.onopen = () => {
        if (ws !== sock) return;
        backoff = 250;
        heard = Date.now();
        sock.send(JSON.stringify({ type: 'hello', role }));
        onFrame({ type: 'open' });
      };
      sock.onmessage = (m) => {
        if (ws !== sock) return;
        heard = Date.now();
        let f;
        try { f = JSON.parse(m.data); } catch (x) { return; }
        // Reload overlays (from Sylva Desktop or the dashboard): load the page again.
        if (f && f.type === 'reload') { location.reload(); return; }
        if (f && f.type !== 'pong') onFrame(f);
      };
      sock.onclose = (e) => {
        if (ws !== sock || closed) return;
        ws = null;
        // 4001: the streamer made a new link. Retrying keeps failing until OBS
        // gets the new one, so retry slowly.
        if (e.code === 4001) backoff = 10000;
        onFrame({ type: 'closed', replaced: e.code === 4001 });
        again();
      };
    };
    // Drop a socket that went quiet and open a new one right away.
    const drop = () => {
      const old = ws;
      ws = null;
      if (old) { old.onclose = null; try { old.close(); } catch (x) { /* already gone */ } }
      onFrame({ type: 'closed', replaced: false });
      backoff = 250;
      again();
    };
    const ping = setInterval(() => {
      if (!ws) return;
      if (ws.readyState === 1) {
        if (Date.now() - heard > DEAD_MS) drop();
        else ws.send('{"type":"ping"}');
      } else if (ws.readyState === 0 && Date.now() - heard > DEAD_MS) drop();
    }, PING_MS);
    // Back online: try now instead of waiting out the backoff.
    const online = () => {
      if (closed || (ws && ws.readyState <= 1)) return;
      clearTimeout(retry);
      retry = null;
      backoff = 250;
      open();
    };
    addEventListener('online', online);
    open();
    return {
      send(obj) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; } return false; },
      close() {
        closed = true;
        clearInterval(ping);
        clearTimeout(retry);
        removeEventListener('online', online);
        if (ws) { ws.onclose = null; ws.close(); ws = null; }
      },
    };
  }

  const states = {};
  const showStatus = () => {
    status.textContent = Object.entries(states).map(([r, s]) => `${r}: ${s}`).join(' · ') || 'connecting';
  };
  const setState = (role, s) => { states[role] = s; showStatus(); };

  // The alert connection, for the alert box.
  function alertConnection(box) {
    const conn = socket('overlay', (f) => {
      if (f.type === 'play') box.play(f);
      else if (f.type === 'stop') box.stop(f.alertId);
      else if (f.type === 'ready' || f.type === 'state') {
        const s = f.state || f;
        soundOff = !!s.muted;
        if (soundOff) stopSound();
        if (box.mute) box.mute(!!s.muted);
        setState('alerts', `${s.queued} queued${s.paused ? ', paused' : ''}${s.muted ? ', muted' : ''}`);
      } else if (f.type === 'open') setState('alerts', 'connected');
      else if (f.type === 'closed') setState('alerts', f.replaced ? 'this link was replaced' : 'reconnecting');
    });
    return conn;
  }

  // The widget connection: data on connect, then live events, fanned out
  // to every widget drawn now.
  function widgetConnection(targets, onData) {
    let lastSeq = 0;
    return socket('widget', (f) => {
      if (f.type === 'widgets') {
        window.sylva.data = f;
        lastSeq = Math.max(lastSeq, ...f.recent.map((e) => e.seq), ...f.chat.map((e) => e.seq), 0);
        if (onData) onData(f);
        targets().forEach((w) => w.data && w.data(f));
      } else if (f.type === 'event') {
        if (f.seq <= lastSeq) return;
        lastSeq = f.seq;
        targets().forEach((w) => w.event && w.event(f));
      } else if (f.type === 'top') {
        if (window.sylva.data) window.sylva.data.top = f.top;
        targets().forEach((w) => w.top && w.top(f.top));
      } else if (f.type === 'open') setState('widgets', 'connected');
      else if (f.type === 'closed') setState('widgets', f.replaced ? 'this link was replaced' : 'reconnecting');
    });
  }

  /* ---------------- One overlay ---------------- */
  // The overlay's widget fills the page; sounds play when its events come in.
  function overlayPage(host, id) {
    const builtin = id === 'alerts' || id === 'chat';
    let w = null, sig = null, alertConn = null, rules = [], alerts = false;
    // The alert on screen now, so a widget made again (new settings) picks it
    // up instead of leaving the queue waiting for an answer that never comes.
    let live = null;
    const ack = (aid) => {
      if (live && live.alertId === aid) live = null;
      if (alertConn && alertConn.send({ type: 'ack', alertId: aid })) window.sylva.acked.push(aid);
    };
    const ring = (kind) => {
      if (soundOff) return;
      for (const r of rules) {
        if (r.on !== 'any' && r.on !== kind && !(r.on === 'alert' && alerts)) continue;
        const a = new Audio(mediaUrl(r.media));
        a.volume = clamp(r.volume, 0, 1, 1);
        a.play().catch(() => {});
      }
    };
    const target = {
      play: (f) => { live = f; if (w) w.play(f); },
      stop: (x) => { if (live && live.alertId === x) live = null; if (w) w.stop(x); },
      mute: (m) => { if (w && w.mute) w.mute(m); },
    };
    const resolve = (list) => {
      const o = (list || []).find((x) => x.id === id) || (builtin ? { id, builtin: id } : null);
      if (!o) return null;
      const base = o.builtin ? DEFAULTS[o.builtin] : null;
      const code = base ? Object.assign({}, base, { values: Object.assign({}, base.values, o.values || {}) }) : o.code;
      return code ? { code, sounds: o.sounds || [], name: o.name } : null;
    };
    const show = (o) => {
      rules = o ? o.sounds : [];
      const s = JSON.stringify(o ? o.code : null);
      if (s === sig) return;
      sig = s;
      if (w) { w.remove(); w = null; }
      if (!o) { setState('overlay', 'this overlay was deleted'); return; }
      // The overlay's own sounds ring with the alert's visual, not before it.
      w = customWidget(host, { widget: 'custom', code: o.code }, ack, (f) => ring(f.event && f.event.kind));
      if (soundOff) w.mute(true);
      alerts = !!o.code.alerts;
      if (alerts && live) w.play(live);
      if (alerts && !alertConn) alertConn = alertConnection(target);
      if (!alerts && alertConn) { alertConn.close(); alertConn = null; delete states.alerts; }
      setState('overlay', o.name || o.code.name || id);
    };
    window.sylva.overlay = id;
    const proxy = {
      data: (d) => { if (w) w.data(d); },
      event: (e) => { if (!alerts) ring(e.kind); if (w) w.event(e); },
      top: (t) => { if (w) w.top(t); },
    };
    widgetConnection(() => [proxy], (d) => show(resolve(d.overlays)));
  }

  if (!sceneMode) {
    // One widget filling the source.
    const host = el('div', 'fill-page');
    root.appendChild(host);
    // `&overlay=<id>` shows one of the streamer's overlays. The plain link is
    // the built-in alerts overlay and `&widget=chat` the built-in chat, so
    // links made before overlays existed keep working.
    const overlayId = params.get('overlay') || (widget === 'chat' ? 'chat' : !WIDGETS[widget] ? 'alerts' : null);
    if (DEFAULTS && overlayId) {
      overlayPage(host, overlayId);
    } else if (!WIDGETS[widget]) {
      let conn = null;
      const box = alertBox((id) => { if (conn.send({ type: 'ack', alertId: id })) window.sylva.acked.push(id); });
      host.appendChild(box.node);
      conn = alertConnection(box);
    } else {
      const w = WIDGETS[widget](host, { kind: params.get('kind'), limit: params.get('limit') });
      widgetConnection(() => [w]);
    }
    return;
  }

  /* ---------------- Scene ---------------- */
  const sceneEl = el('div');
  sceneEl.id = 'scene';
  root.appendChild(sceneEl);
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080) || 1;
    sceneEl.style.transform = `scale(${s})`;
  };
  addEventListener('resize', fit);
  fit();

  let alertConn = null;
  const ackAlert = (id) => {
    if (live && live.alertId === id) live = null;
    if (alertConn && alertConn.send({ type: 'ack', alertId: id })) window.sylva.acked.push(id);
  };
  const box = alertBox(ackAlert);
  // Alerts go to the alert box, or to a custom widget that plays them.
  let player = box;
  let muted = null;
  let live = null;
  const alertTarget = {
    play: (f) => { live = f; player.play(f); },
    stop: (id) => { if (live && live.alertId === id) live = null; player.stop(id); },
    mute: (m) => { if (m !== muted) { muted = m; if (player.mute) player.mute(m); } },
  };
  let drawn = [];
  let version = null;

  const build = (published, data) => {
    version = published ? published.version : 0;
    window.sylva.scene = published || null;
    drawn.forEach((w) => w.remove && w.remove());
    sceneEl.textContent = '';
    drawn = [];
    const before = player;
    player = box;
    const items = (published ? published.scene.items : DEFAULT_ITEMS).map(builtIn);
    for (const it of items) {
      const node = el('div', 'item');
      node.dataset.label = (it.widget === 'custom' && it.code && it.code.name) || NAMES[it.widget] || it.widget;
      node.dataset.widget = it.widget;
      Object.assign(node.style, { left: it.x + 'px', top: it.y + 'px', width: it.w + 'px', height: it.h + 'px' });
      sceneEl.appendChild(node);
      if (it.widget === 'alerts') node.appendChild(box.node);
      else if (it.widget === 'custom') {
        const w = customWidget(node, it, ackAlert);
        if (it.code && it.code.alerts) player = w;
        drawn.push(w);
      } else if (WIDGETS[it.widget]) {
        const w = WIDGETS[it.widget](node, it);
        if (data && w.data) w.data(data);
        drawn.push(w);
      }
    }
    // Alerts are taken only while the scene has something to play them.
    if (live && player !== before) player.play(live);
    const wantAlerts = items.some((it) => it.widget === 'alerts' || (it.widget === 'custom' && it.code && it.code.alerts));
    if (wantAlerts && !alertConn) alertConn = alertConnection(alertTarget);
    if (!wantAlerts && alertConn) { alertConn.close(); alertConn = null; delete states.alerts; }
    setState('scene', published ? `version ${published.version}, ${items.length} widgets` : 'nothing published yet, showing the defaults');
  };

  widgetConnection(() => drawn, (data) => {
    const v = data.scene ? data.scene.version : 0;
    // Same layout: the widgets just take the new data.
    if (v !== version) build(data.scene, null);
  });
})();
</script>
</body>
</html>
