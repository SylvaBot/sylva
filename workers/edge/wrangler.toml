name = "sylva-edge"
main = "build/index.js"
compatibility_date = "2026-11-01"
account_id = "4fe7b7aea8ef5f7e1246f21c717d56dd"
workers_dev = true

[build]
# The dashboard is embedded in the Worker (see build.rs), so build it first.
command = "cd ../.. && npm run build:web && cd workers/edge && worker-build --release"

[[durable_objects.bindings]]
name = "CHANNEL"
class_name = "ChannelDo"

[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "AccountDo"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDo"

# SQLite backed storage is required for the SQL API and is the default for new classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelDo"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountDo", "DirectoryDo"]

# Secrets (set with `wrangler secret put`, or in .dev.vars locally):
#   TWITCH_CLIENT_SECRET    the Twitch application secret (set in the Cloudflare dashboard)
#   TWITCH_EVENTSUB_SECRET  the secret given to Twitch when creating the conduit shard
#   SYLVA_TOKEN_KEY         64 hex characters: encrypts Twitch tokens at rest
#   SYLVA_ADMIN_TOKEN       bearer token for /admin routes and test scripts

[vars]
# Not secret: the public client id of the "sylva dev" Twitch application.
TWITCH_CLIENT_ID = "t9z14i1qdp044der47bq7lpu5w0eru"
# Twitch's addresses. The end to end tests point these at a local fake Twitch.
TWITCH_AUTH_URL = "https://id.twitch.tv/oauth2"
TWITCH_API_URL = "https://api.twitch.tv/helix"
# The shared Sylva bot account (Twitch sylva_bot) that replies in every
# channel. Empty means each streamer's own account replies. To change it,
# sign in to the bot account at /auth/twitch/bot and copy the values it shows.
SYLVA_BOT_USER_ID = "1613810135"
SYLVA_BOT_LOGIN = "sylva_bot"
# Leave empty. The end to end tests point the public services that some chat
# commands read (jokes, facts, dictionaries, emotes) at a local stand-in.
SYLVA_LOOKUP_URL = ""

# Workers Logs: keeps console output (such as rejected webhooks) for 7 days.
[observability]
enabled = true
