[workspace]
resolver = "2"
members = ["crates/sylva-core", "workers/edge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sylva-core = { path = "crates/sylva-core" }

[profile.release]
# Small WebAssembly matters on Workers: the bundle is limited in size and
# smaller modules start faster.
opt-level = "z"
lto = true
codegen-units = 1
